<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05080d">
<title>Vision 6D</title>
<style>
  :root { --bg: #05080d; --panel: #0a121c; --panel2: #0e1926; --line: rgba(53, 224, 255, .28); --cyan: #35e0ff; --pink: #ff4fd8; --text: #dff6ff; --dim: #86a6ba; --ok: #5ee6a8; --bad: #ff7a8a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button:hover:not(:disabled) { background: rgba(53, 224, 255, .12); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: rgba(53, 224, 255, .18); border-color: var(--cyan); color: #fff; font-weight: 600; }
  button[aria-pressed="true"] { background: rgba(53, 224, 255, .22); border-color: var(--cyan); color: #fff; }
  select { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); font-weight: 600; }
  .app { display: grid; grid-template-columns: 360px minmax(0, 1fr); height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 16px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { letter-spacing: .3em; font-weight: 700; color: var(--cyan); text-shadow: 0 0 12px rgba(53, 224, 255, .6); }
  .tagline { margin: 4px 0 0; color: var(--dim); font-size: 12.5px; }
  #drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 18px 14px; text-align: center; cursor: pointer; background: var(--panel2); }
  #drop.over { border-color: var(--cyan); background: rgba(53, 224, 255, .12); }
  #drop b { display: block; font-size: 15px; } #drop span { color: var(--dim); font-size: 12px; }
  #queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 26vh; overflow-y: auto; }
  #queue li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid transparent; border-radius: 8px; cursor: pointer; background: var(--panel2); }
  #queue li.sel { border-color: var(--cyan); }
  #queue .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #queue .st { font-size: 11.5px; color: var(--dim); white-space: nowrap; } #queue .st.done { color: var(--ok); } #queue .st.error { color: var(--bad); } #queue .st.working { color: var(--cyan); }
  .row { display: flex; align-items: center; gap: 8px; min-height: 32px; }
  .row label { width: 122px; flex: none; color: var(--dim); font-size: 12.5px; }
  .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--cyan); } .row select { flex: 1; min-width: 0; }
  .row output { width: 40px; text-align: right; font: 11.5px ui-monospace, Consolas, monospace; color: var(--cyan); }
  .muted { color: var(--dim); font-size: 12px; margin: 4px 0 0; }
  .path { font: 12px ui-monospace, Consolas, monospace; word-break: break-all; color: var(--text); background: var(--panel2); border-radius: 8px; padding: 7px 9px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; } .btns button { flex: 1; white-space: nowrap; }
  ul.files { margin: 0; padding-left: 16px; color: var(--dim); font-size: 12px; } ul.files li { margin: 2px 0; }
  main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; height: 100%; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .toolbar .grow { flex: 1; } .toolbar .info { color: var(--dim); font-size: 12.5px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; } .seg button { border: 0; border-radius: 0; min-width: 58px; }
  .stage { position: relative; min-height: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); pointer-events: none; }
  #hint { position: absolute; left: 14px; bottom: 10px; color: var(--dim); font-size: 12px; pointer-events: none; text-shadow: 0 0 6px #000; }
  #readout { position: absolute; left: 14px; top: 10px; font: 11px/1.5 ui-monospace, Consolas, monospace; color: var(--cyan); white-space: pre; pointer-events: none; text-shadow: 0 0 6px #000; }
  #maps { display: flex; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); overflow-x: auto; min-height: 118px; background: var(--panel); }
  #maps figure { margin: 0; flex: none; text-align: center; } #maps canvas { height: 76px; width: auto; display: block; border: 1px solid var(--line); border-radius: 6px; background: repeating-conic-gradient(#16212e 0 25%, #0c141d 0 50%) 0 0 / 14px 14px; }
  #maps figcaption { font-size: 11px; color: var(--dim); margin-top: 3px; }
  #toast { position: fixed; right: 16px; bottom: 16px; max-width: 460px; background: var(--panel2); border: 1px solid var(--cyan); border-radius: 10px; padding: 10px 14px; opacity: 0; transition: opacity .25s; pointer-events: none; word-break: break-word; }
  #toast.show { opacity: 1; } #toast.bad { border-color: var(--bad); }
  [hidden] { display: none !important; }
  @media (max-width: 820px) { .app { grid-template-columns: 1fr; height: auto; } aside { border-right: 0; border-bottom: 1px solid var(--line); } main { height: 90vh; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div>
      <div class="head"><div class="brand">VISION 6D</div><button id="lang" data-lang-toggle></button></div>
      <p class="tagline" data-i18n="app.tagline"></p>
    </div>

    <div>
      <div id="drop" tabindex="0" role="button"><b data-i18n="drop.title"></b><span data-i18n="drop.hint"></span></div>
      <input id="files" type="file" accept="image/*" multiple hidden>
      <div class="btns" style="margin-top:8px"><button id="sample" data-i18n="drop.sample"></button></div>
    </div>

    <div>
      <h2 data-i18n="queue.title"></h2>
      <ul id="queue"></ul>
      <p class="muted" id="queue-empty" data-i18n="queue.empty"></p>
      <div class="btns" style="margin-top:8px"><button id="clear" data-i18n="queue.clear"></button></div>
    </div>

    <div class="btns"><button id="run-one" data-i18n="run.one"></button><button id="run-all" class="primary" data-i18n="run.all"></button></div>

    <div>
      <h2 data-i18n="opt.title"></h2>
      <div class="row"><label for="detail" data-i18n="opt.detail"></label><select id="detail"><option value="128">128</option><option value="256" selected>256</option><option value="384">384</option><option value="512">512</option></select></div>
      <div class="row"><label for="strength" data-i18n="opt.strength"></label><input id="strength" type="range" min="0.05" max="0.8" step="0.01" value="0.3"><output></output></div>
      <div class="row"><label for="layers" data-i18n="opt.layers"></label><input id="layers" type="range" min="2" max="12" step="1" value="5"><output></output></div>
      <div class="row"><label for="invert" data-i18n="opt.invert"></label><input id="invert" type="checkbox"></div>
      <div class="row"><label for="anatomy" data-i18n="opt.anatomy"></label><select id="anatomy"><option value="auto" data-i18n="opt.anatomy.auto"></option><option value="on" data-i18n="opt.anatomy.on"></option><option value="off" data-i18n="opt.anatomy.off"></option></select></div>
      <div class="btns" style="margin-top:6px"><button id="depth-load" data-i18n="opt.depthMap"></button><button id="depth-clear" data-i18n="opt.depthClear" hidden></button></div>
      <input id="depth-file" type="file" accept="image/*" hidden>
      <p class="muted" data-i18n="opt.depthHint"></p>
    </div>

    <div>
      <h2 data-i18n="out.title"></h2>
      <div class="path" id="outdir">…</div>
      <div class="btns" style="margin-top:8px"><button id="open" data-i18n="out.open"></button></div>
    </div>

    <div>
      <h2 data-i18n="files.title"></h2>
      <ul class="files">
        <li data-i18n="files.3d"></li><li data-i18n="files.4d"></li><li data-i18n="files.6d"></li>
        <li data-i18n="files.ply"></li><li data-i18n="files.maps"></li><li data-i18n="files.anatomy"></li>
      </ul>
      <p class="muted" data-i18n="note.depth"></p>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <div class="seg" role="group">
        <button data-view="3d" data-i18n="view.3d"></button><button data-view="4d" data-i18n="view.4d"></button>
        <button data-view="6d" data-i18n="view.6d"></button><button data-view="points" data-i18n="view.points"></button>
      </div>
      <button id="reset" data-i18n="view.reset"></button>
      <span class="grow"></span>
      <span class="info" id="person"></span>
    </div>
    <div class="stage">
      <canvas id="view"></canvas>
      <div id="readout"></div>
      <div id="empty" data-i18n="view.empty"></div>
      <div id="hint" data-i18n="view.hint"></div>
    </div>
    <div id="maps"></div>
  </main>
</div>
<div id="toast" role="status"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
