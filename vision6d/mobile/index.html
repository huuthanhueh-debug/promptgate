<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: mediastream:; connect-src 'self'">
<meta name="theme-color" content="#05080d">
<title>Vision 6D</title>
<style>
  :root { --bg: #05080d; --panel: rgba(8, 16, 26, .86); --line: rgba(53, 224, 255, .35); --cyan: #35e0ff; --pink: #ff4fd8; --text: #dff6ff; --dim: #7fa3b8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 40px; cursor: pointer; }
  button:active { background: rgba(53, 224, 255, .18); }
  button[aria-pressed="true"], button.on { background: rgba(53, 224, 255, .2); border-color: var(--cyan); color: #fff; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.active { display: block; }
  .brand { letter-spacing: .32em; font-weight: 600; font-size: 13px; color: var(--cyan); text-shadow: 0 0 12px rgba(53, 224, 255, .6); }

  /* home */
  #preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #home .top { position: absolute; top: 0; left: 0; right: 0; padding: calc(14px + env(safe-area-inset-top)) 16px 26px; background: linear-gradient(#05080dcc, transparent); }
  #home .top p { margin: 6px 0 0; color: var(--dim); font-size: 12px; }
  #notice { position: absolute; left: 16px; right: 16px; top: 38%; text-align: center; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: none; }
  #home .bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 16px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, #05080dee 45%); }
  .shots { display: flex; align-items: center; justify-content: space-around; }
  #shutter { width: 74px; height: 74px; border-radius: 50%; border: 3px solid #fff; background: radial-gradient(circle, #fff 0 56%, transparent 60%); padding: 0; box-shadow: 0 0 22px rgba(53, 224, 255, .7); }
  #shutter:disabled { opacity: .35; box-shadow: none; }
  .shots .side { width: 104px; font-size: 13px; white-space: nowrap; padding: 9px 6px; }
  .demos { display: flex; gap: 8px; margin-top: 14px; }
  .demos button { flex: 1; font-size: 13px; }
  .frame { position: absolute; inset: 15% 9% 30%; pointer-events: none; border: 1px solid transparent; background: linear-gradient(var(--cyan), var(--cyan)) top left / 26px 2px no-repeat, linear-gradient(var(--cyan), var(--cyan)) top left / 2px 26px no-repeat, linear-gradient(var(--cyan), var(--cyan)) top right / 26px 2px no-repeat, linear-gradient(var(--cyan), var(--cyan)) top right / 2px 26px no-repeat, linear-gradient(var(--cyan), var(--cyan)) bottom left / 26px 2px no-repeat, linear-gradient(var(--cyan), var(--cyan)) bottom left / 2px 26px no-repeat, linear-gradient(var(--cyan), var(--cyan)) bottom right / 26px 2px no-repeat, linear-gradient(var(--cyan), var(--cyan)) bottom right / 2px 26px no-repeat; opacity: .8; }

  /* viewer */
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud, #lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #lines line { stroke: var(--cyan); stroke-width: 1; opacity: .65; }
  #lines circle { fill: var(--cyan); }
  .label { position: absolute; left: 0; top: 0; pointer-events: auto; padding: 3px 8px; font-size: 11.5px; white-space: nowrap; background: rgba(5, 12, 20, .78); border: 1px solid var(--line); border-radius: 6px; color: var(--text); min-height: 0; }
  .label.sel { border-color: var(--pink); color: #fff; box-shadow: 0 0 10px rgba(255, 79, 216, .6); }
  #viewer .top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 10px 8px; background: linear-gradient(#05080dd9, transparent); }
  #viewer .top .grow { flex: 1; }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .lang { min-width: 46px; min-height: 36px; padding: 5px 10px; font-weight: 600; letter-spacing: .08em; color: var(--cyan); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; min-width: 62px; }
  #readout { position: absolute; left: 10px; top: calc(58px + env(safe-area-inset-top)); font: 10.5px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--cyan); opacity: .85; white-space: pre; pointer-events: none; text-shadow: 0 0 6px #000; }
  #info { position: absolute; left: 10px; right: 10px; bottom: calc(var(--sheet-h, 190px) + 10px); background: var(--panel); border: 1px solid var(--pink); border-radius: 12px; padding: 10px 12px; display: none; }
  #info b { color: #fff; font-size: 15px; } #info i { color: var(--dim); font-style: normal; margin-left: 6px; } #info p { margin: 4px 0 0; }
  #sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); backdrop-filter: blur(6px); }
  .tabs { display: flex; gap: 6px; margin-bottom: 6px; }
  .tabs button { flex: 1; min-height: 34px; padding: 5px 6px; font-size: 12.5px; }
  .pane { display: none; max-height: 34vh; overflow-y: auto; }
  .pane.active { display: block; }
  .row { display: flex; align-items: center; gap: 8px; min-height: 36px; }
  .row label { width: 96px; flex: none; font-size: 12px; color: var(--dim); }
  .row output { width: 46px; flex: none; text-align: right; font: 11px ui-monospace, Menlo, monospace; color: var(--cyan); }
  .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--cyan); height: 28px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 3px 0; }
  .chips button { flex: 1; min-height: 36px; padding: 6px 8px; font-size: 12.5px; white-space: nowrap; }
  #toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); max-width: 86%; background: var(--panel); border: 1px solid var(--cyan); border-radius: 12px; padding: 9px 14px; text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9; }
  #toast.show { opacity: 1; }
  .note { font-size: 10.5px; color: var(--dim); margin: 4px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<section id="home" class="screen active">
  <video id="preview" playsinline muted autoplay></video>
  <div class="frame"></div>
  <div class="top">
    <div class="bar"><div class="brand">VISION 6D</div><button class="lang" data-lang-toggle></button></div>
    <p data-i18n="home.tagline"></p>
  </div>
  <div id="notice"></div>
  <div class="bottom">
    <div class="shots">
      <button id="pick" class="side" data-i18n="home.pick"></button>
      <button id="shutter" data-i18n-aria="home.shutter" disabled></button>
      <button id="flip" class="side" data-i18n="home.flip"></button>
    </div>
    <div class="demos">
      <button id="demo-scene" data-i18n="home.demoScene"></button>
      <button id="demo-person" data-i18n="home.demoPerson"></button>
    </div>
    <input id="file" type="file" accept="image/*" hidden>
  </div>
</section>

<section id="viewer" class="screen">
  <canvas id="stage"></canvas>
  <svg id="lines"></svg>
  <div id="hud"></div>
  <div class="top">
    <button id="back" data-i18n="viewer.back"></button>
    <span class="grow"></span>
    <button class="lang" data-lang-toggle></button>
    <div class="seg" role="group" data-i18n-aria="mode.label">
      <button id="mode-relief" data-mode="relief" data-i18n="mode.relief"></button>
      <button id="mode-body" data-mode="body" data-i18n="mode.body"></button>
    </div>
  </div>
  <div id="readout"></div>
  <div id="info"><b></b><i></i><p></p></div>
  <div id="sheet">
    <div class="tabs">
      <button data-tab="view" class="on" data-i18n="tab.view"></button>
      <button data-tab="axes" data-i18n="tab.axes"></button>
      <button data-tab="align" id="tab-align" data-i18n="tab.align"></button>
    </div>
    <div class="pane active" data-pane="view">
      <div id="relief-opts">
        <div class="chips" id="styles">
          <button data-style="photo" data-i18n="style.photo"></button>
          <button data-style="mix" data-i18n="style.mix"></button>
          <button data-style="holo" data-i18n="style.holo"></button>
        </div>
        <div class="row"><label for="strength" data-i18n="ctl.strength"></label><input id="strength" type="range" min="0" max="1.2" step="0.01" value="0.5"><output></output></div>
      </div>
      <div id="body-opts">
        <div class="chips" id="systems">
          <button data-system="skeleton" data-i18n="sys.skeleton"></button>
          <button data-system="organs" data-i18n="sys.organs"></button>
          <button data-system="vessels" data-i18n="sys.vessels"></button>
          <button data-system="photo" data-i18n="sys.photo"></button>
        </div>
      </div>
      <div class="row"><label for="explode" data-i18n="ctl.explode"></label><input id="explode" type="range" min="0" max="1" step="0.01" value="0"><output></output></div>
      <div class="chips">
        <button id="orbit" data-i18n="btn.orbit"></button>
        <button id="gyro" data-i18n="btn.gyro"></button>
        <button id="reset" data-i18n="btn.reset"></button>
        <button id="save" data-i18n="btn.save"></button>
      </div>
      <p class="note" id="disclaimer" data-i18n="disclaimer"></p>
    </div>
    <div class="pane" data-pane="axes" id="axes"></div>
    <div class="pane" data-pane="align">
      <div class="row"><label for="fit-scale" data-i18n="fit.scale"></label><input id="fit-scale" type="range" min="0.5" max="1.6" step="0.01" value="1"><output></output></div>
      <div class="row"><label for="fit-x" data-i18n="fit.x"></label><input id="fit-x" type="range" min="-0.6" max="0.6" step="0.005" value="0"><output></output></div>
      <div class="row"><label for="fit-y" data-i18n="fit.y"></label><input id="fit-y" type="range" min="-0.6" max="0.6" step="0.005" value="0"><output></output></div>
      <p class="note" data-i18n="fit.note"></p>
    </div>
  </div>
</section>

<div id="toast" role="status"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
