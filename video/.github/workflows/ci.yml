name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node tests/video.js

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Restore signing key (optional secret)
        env:
          KEYSTORE_B64: ${{ secrets.PGV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pgv.keystore"
            echo "PGV_KEYSTORE=$RUNNER_TEMP/pgv.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          PGV_KS_PASS: ${{ secrets.PGV_KS_PASS }}
          PGV_KEY_ALIAS: ${{ secrets.PGV_KEY_ALIAS }}
        run: node android/build.js
      - uses: actions/upload-artifact@v4
        with:
          name: promptgate-video-apk
          path: dist/promptgate-video.apk
          if-no-files-found: error

  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: promptgate-video-apk
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and render on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/ci-selftest.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence
          path: |
            dist/emulator.png
            dist/logcat.txt
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: promptgate-video-apk
      - name: Publish the APK on the "video-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view video-latest >/dev/null 2>&1 || gh release create video-latest --target "$GITHUB_SHA" --title "PromptGate Video (APK)" --notes "Bản APK mới nhất, build tự động từ nhánh main. Tải promptgate-video.apk về điện thoại Android rồi mở để cài."
          gh release upload video-latest promptgate-video.apk --clobber
